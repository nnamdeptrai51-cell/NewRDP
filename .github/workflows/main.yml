name: RDP Premium - DucThengGaming 🚀
on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Chọn thời gian (ví dụ: 90d, 75d, 30d, 6h, 5h, 40p, 10p)"
        default: "30d"
jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 525600
    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" -ErrorAction SilentlyContinue
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
      - name: Create Premium User DucThengGaming
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "DucThengGaming" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "DucThengGaming" -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member "DucThengGaming"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "DucThengGaming"
          }
          echo "RDP_PREMIUM_CREDS=User: DucThengGaming | Password: $password" >> $env:GITHUB_ENV
      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force
      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=DucThengGaming-$env:GITHUB_RUN_ID --accept-routes=false
          $tsIP = $null
          $retry = 0
          while (-not $tsIP -and $retry -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 3
              $retry++
          }
          if (-not $tsIP) { $tsIP="127.0.0.1" }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      - name: Optimize RDP
        run: |
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' -Name 'VisualFXSetting' -Value 2 -Force
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name 'FontSmoothing' -Value 0
          reg add "HKCU\Software\Microsoft\Terminal Server Client" /v AudioQualityMode /t REG_DWORD /d 1 /f
      - name: Show Intro & Premium Info
        run: |
          Clear-Host
          Write-Host "🚀 PREMIUM SIÊU TO - DUC THENG GAMING 🚀" -ForegroundColor Yellow
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "$env:RDP_PREMIUM_CREDS"
      - name: System Cleanup (Dọn rác)
        run: |
          $paths = @("$env:TEMP\*", "C:\Windows\Temp\*", "$env:LocalAppData\Temp\*", "C:\Windows\Prefetch\*", "C:\Windows\SoftwareDistribution\Download\*", "C:\Windows\Logs\*")
          $start = Get-Date
          foreach ($p in $paths) {
              if (Test-Path $p) {
                  Get-ChildItem $p -Force -ErrorAction SilentlyContinue | ForEach-Object {
                      Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
                      Start-Sleep -Milliseconds 10
                  }
              }
          }
          $end = Get-Date
          Write-Host "Dọn rác hoàn tất! Thời gian: $([math]::Round(($end - $start).TotalSeconds,2)) giây"
      - name: Maintain RDP Session with Timer
        run: |
          $options = @{
            "90d"=90*24*3600; "75d"=75*24*3600; "60d"=60*24*3600; "50d"=50*24*3600; "40d"=40*24*3600; "30d"=30*24*3600; "20d"=20*24*3600; "10d"=10*24*3600;
            "6h"=6*3600; "5h"=5*3600; "4h"=4*3600; "3h"=3*3600; "2h"=2*3600; "1h"=1*3600;
            "59p"=59*60; "50p"=50*60; "40p"=40*60; "30p"=30*60; "20p"=20*60; "10p"=10*60; "5p"=5*60
          }
          $inputTime = "${{ github.event.inputs.duration }}"
          if ($options.ContainsKey($inputTime)) { $totalSeconds = $options[$inputTime] } else { $totalSeconds = 30*24*3600 }
          Write-Host "⏳ RDP chạy trong $inputTime"
          while ($totalSeconds -gt 0) {
              $daysLeft = [math]::Floor($totalSeconds/86400)
              $hoursLeft = [math]::Floor(($totalSeconds % 86400)/3600)
              $minutesLeft = [math]::Floor(($totalSeconds % 3600)/60)
              Write-Host "[PREMIUM] RDP IP: $env:TAILSCALE_IP | User: DucThengGaming | Thời gian còn: $daysLeft ngày $hoursLeft giờ $minutesLeft phút" -ForegroundColor Cyan
              Start-Sleep -Seconds 60
              $totalSeconds -= 60
          }
          Write-Host "⏰ Thời gian RDP đã kết thúc!”
          
